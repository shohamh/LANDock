<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <title>LANDock architecture</title>
  <desc>A desktop PC runs three Moonlight windows. Over the local network each connects to its own Apollo instance on the laptop. Each Apollo instance creates one virtual display. The laptop's desktop is the laptop screen plus the three virtual displays side by side.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f4f6fa; stroke: #5b6b86; stroke-width: 1.5; }
      .mon { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .win { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .vd { fill: #dcfce7; stroke: #15803d; stroke-width: 1.5; }
      .lap { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
      .link { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .link2 { stroke: #15803d; stroke-width: 2; fill: none; marker-end: url(#arrow2); }
      .t { fill: #111827; }
      .tw { fill: #ffffff; }
      .sub { fill: #4b5563; font-size: 12px; }
      .h { font-weight: 600; font-size: 16px; fill: #111827; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .box { fill: #161b22; stroke: #8b949e; }
        .win { fill: #12263f; stroke: #58a6ff; }
        .vd { fill: #0f2d1a; stroke: #3fb950; }
        .lap { fill: #3a2a0a; stroke: #d29922; }
        .link { stroke: #58a6ff; }
        .link2 { stroke: #3fb950; }
        .t, .h { fill: #e6edf3; }
        .sub { fill: #9da7b3; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
  </defs>
  <rect class="bg" width="960" height="540"/>

  <!-- desktop PC -->
  <rect class="box" x="20" y="20" width="440" height="500" rx="12"/>
  <text class="h" x="40" y="50">Desktop PC (client)</text>
  <text class="sub" x="40" y="70">your monitors, mouse and keyboard</text>

  <rect class="mon" x="40" y="95" width="120" height="75" rx="4"/><rect class="win" x="46" y="101" width="108" height="63"/>
  <text class="t" x="100" y="128" text-anchor="middle">Moonlight</text><text class="t" x="100" y="146" text-anchor="middle">M1</text>
  <rect class="mon" x="175" y="95" width="120" height="75" rx="4"/><rect class="win" x="181" y="101" width="108" height="63"/>
  <text class="t" x="235" y="128" text-anchor="middle">Moonlight</text><text class="t" x="235" y="146" text-anchor="middle">M2</text>
  <rect class="mon" x="310" y="95" width="130" height="75" rx="4"/><rect class="win" x="316" y="101" width="118" height="63"/>
  <text class="t" x="375" y="128" text-anchor="middle">Moonlight</text><text class="t" x="375" y="146" text-anchor="middle">TV (4K)</text>
  <text class="sub" x="40" y="195">monitor 1</text><text class="sub" x="175" y="195">monitor 2</text><text class="sub" x="310" y="195">monitor 3</text>

  <text class="h" x="40" y="250">LANDock app (client)</text>
  <text class="sub" x="40" y="272">starts one Moonlight per stream, waits for the first</text>
  <text class="sub" x="40" y="290">video frame, puts each window on its monitor</text>
  <text class="sub" x="40" y="320">pointer: "absolute mouse" follows your pointer</text>
  <text class="sub" x="40" y="338">across the windows; keys go to the focused window</text>

  <!-- network arrows -->
  <path class="link" d="M100 172 C 100 260, 520 120, 560 150"/>
  <path class="link" d="M235 172 C 260 300, 520 230, 560 262"/>
  <path class="link" d="M375 172 C 420 360, 520 330, 560 374"/>
  <text class="sub" x="470" y="470" text-anchor="middle">one stream per display</text>
  <text class="sub" x="470" y="488" text-anchor="middle">video + audio down, mouse + keyboard up</text>
  <text class="sub" x="470" y="506" text-anchor="middle">over your local network</text>

  <!-- laptop -->
  <rect class="box" x="500" y="20" width="440" height="500" rx="12"/>
  <text class="h" x="520" y="50">Laptop (host)</text>
  <text class="sub" x="520" y="70">one Windows desktop, 4 screens wide</text>

  <rect class="box" x="560" y="100" width="150" height="100" rx="8"/><text class="t" x="635" y="125" text-anchor="middle">Apollo C</text><text class="sub" x="635" y="144" text-anchor="middle">port 49989</text><text class="sub" x="635" y="162" text-anchor="middle">creates VD 1920x1080</text>
  <rect class="box" x="560" y="212" width="150" height="100" rx="8"/><text class="t" x="635" y="237" text-anchor="middle">Apollo D</text><text class="sub" x="635" y="256" text-anchor="middle">port 50989</text><text class="sub" x="635" y="274" text-anchor="middle">creates VD 1920x1080</text>
  <rect class="box" x="560" y="324" width="150" height="100" rx="8"/><text class="t" x="635" y="349" text-anchor="middle">Apollo E</text><text class="sub" x="635" y="368" text-anchor="middle">port 51989</text><text class="sub" x="635" y="386" text-anchor="middle">creates VD 3840x2160</text>

  <path class="link2" d="M712 150 L 780 150"/><path class="link2" d="M712 262 L 780 262"/><path class="link2" d="M712 374 L 780 374"/>

  <rect class="lap" x="780" y="100" width="130" height="38" rx="4"/><text class="t" x="845" y="124" text-anchor="middle">laptop screen</text>
  <rect class="vd" x="780" y="146" width="130" height="38" rx="4"/><text class="t" x="845" y="170" text-anchor="middle">virtual M1</text>
  <rect class="vd" x="780" y="192" width="130" height="38" rx="4"/><text class="t" x="845" y="216" text-anchor="middle">virtual M2</text>
  <rect class="vd" x="780" y="238" width="130" height="62" rx="4"/><text class="t" x="845" y="268" text-anchor="middle">virtual TV (4K)</text>
  <text class="sub" x="845" y="322" text-anchor="middle">left to right in the Windows desktop:</text>
  <text class="sub" x="845" y="340" text-anchor="middle">laptop | M1 | M2 | TV</text>
  <text class="sub" x="845" y="362" text-anchor="middle">(shown stacked here)</text>

  <text class="h" x="520" y="455">Also on the laptop</text>
  <text class="sub" x="520" y="476">LANDock app (host) · SudoVDA virtual display driver ·</text>
  <text class="sub" x="520" y="494">supervisor · pairing · layout watcher · vddtool</text>
</svg>
